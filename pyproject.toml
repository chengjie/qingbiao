[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-image-compressor"
version = "0.1.0"
description = "Local batch image compression for Excel and WPS workbooks"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<13", "PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
excel-compress = "excel_compressor.cli:main"

[project.gui-scripts]
excel-image-compressor = "excel_compressor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
excel_compressor = ["assets/*.svg", "assets/*.png", "assets/*.ico"]
